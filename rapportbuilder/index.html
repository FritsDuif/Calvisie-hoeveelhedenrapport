<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapportbouwer hoeveelheden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Werkbank links (formulier), papier rechts (A4 staand). Huiskleuren Calvisie: navy + blauw.
   Opmaak en werking overgenomen van de houtrot-rapportbouwer. */
:root{
  --blue:#2d63ad; --navy:#0e3a6c;
  --ui-bg:#eceef2; --ui-panel:#ffffff; --ui-field:#ffffff; --ui-sunk:#f6f7f9; --ui-soft:#eaf1fb; --ui-softline:#c9d7ec;
  --ui-text:#1f2733; --ui-text2:#3a4352; --ui-muted:#667085; --ui-border:#d7dbe2; --ui-accent:#2d63ad; --ui-accent-h:#244f8c; --ui-onaccent:#ffffff;
  --ui-bar:#0e3a6c; --ui-onbar:#ffffff;
  --ok:#1f7a4d; --ok-bg:#e8f5ee; --warn:#8a5300; --warn-bg:#fff3e0; --bad:#b42318; --bad-bg:#fdecea;
  --shadow:0 2px 12px rgba(15,30,60,.14);
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ui-bg:#11161d; --ui-panel:#18202a; --ui-field:#0f151c; --ui-sunk:#141b23; --ui-soft:#1b2a3f; --ui-softline:#2c4466;
  --ui-text:#e6ebf2; --ui-text2:#c5ced9; --ui-muted:#93a0b1; --ui-border:#2c3644; --ui-accent:#6f9fe0; --ui-accent-h:#8bb3ea; --ui-onaccent:#0b1420;
  --ui-bar:#0a2343; --ui-onbar:#e6ebf2;
  --ok:#6fd3a0; --ok-bg:#12291f; --warn:#f0b35a; --warn-bg:#2b2114; --bad:#ff8a7a; --bad-bg:#2e1715;
  --shadow:0 2px 14px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --ui-bg:#11161d; --ui-panel:#18202a; --ui-field:#0f151c; --ui-sunk:#141b23; --ui-soft:#1b2a3f; --ui-softline:#2c4466;
  --ui-text:#e6ebf2; --ui-text2:#c5ced9; --ui-muted:#93a0b1; --ui-border:#2c3644; --ui-accent:#6f9fe0; --ui-accent-h:#8bb3ea; --ui-onaccent:#0b1420;
  --ui-bar:#0a2343; --ui-onbar:#e6ebf2;
  --ok:#6fd3a0; --ok-bg:#12291f; --warn:#f0b35a; --warn-bg:#2b2114; --bad:#ff8a7a; --bad-bg:#2e1715;
  --shadow:0 2px 14px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ui-text);background:var(--ui-bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ui-accent);outline-offset:1px}

/* ---------- balk ---------- */
.topbar{height:52px;display:flex;align-items:center;gap:8px;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--ui-bar);color:var(--ui-onbar)}
.topbar .brand{font-weight:700;letter-spacing:.08em;font-size:14px;margin-right:auto;white-space:nowrap}
.topbar .brand small{font-weight:400;letter-spacing:0;opacity:.7;margin-left:8px}
.topbar button{font-size:13px;border:1px solid color-mix(in srgb,var(--ui-onbar) 35%,transparent);background:transparent;color:var(--ui-onbar);border-radius:6px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.topbar button:hover{background:color-mix(in srgb,var(--ui-onbar) 12%,transparent)}
.topbar button:disabled{opacity:.4;cursor:default}
.topbar button.primary{background:var(--ui-onbar);color:var(--ui-bar);font-weight:600}
.topbar .proef{font-size:11px;border:1px solid color-mix(in srgb,var(--ui-onbar) 45%,transparent);border-radius:999px;padding:3px 9px;white-space:nowrap}
.status{font-size:12px;display:flex;align-items:center;gap:8px;min-width:0;opacity:.85}
.status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}

/* ---------- indeling ---------- */
.app{display:flex;height:calc(100% - 52px)}
.editor{width:520px;min-width:400px;background:var(--ui-panel);border-right:1px solid var(--ui-border);display:flex;flex-direction:column}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 12px;border-bottom:1px solid var(--ui-border)}
.tabs button{font-size:12.5px;border:1px solid var(--ui-border);background:var(--ui-field);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--ui-text2)}
.tabs button.on{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--ui-onaccent)}
.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:5px;vertical-align:middle}
#form{flex:1;overflow:auto;padding:14px 16px 90px}
.preview{flex:1;overflow:auto;padding:24px}
#pages{width:210mm;margin:0 auto}

/* ---------- formulier ---------- */
.sec-title{font-size:15px;font-weight:700;margin:2px 0 2px}
.hint{font-size:12px;color:var(--ui-muted);margin:0 0 12px;line-height:1.5}
.f{display:block;margin-bottom:10px}
.f>span,.lbl{display:block;font-size:12px;font-weight:600;color:var(--ui-text2);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;font:inherit;font-size:13px;border:1px solid var(--ui-border);border-radius:6px;padding:6px 8px;background:var(--ui-field);color:var(--ui-text)}
textarea{resize:vertical;line-height:1.45}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ui-softline);border-color:var(--ui-accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.ctl{display:flex;gap:2px;flex:none}
.ctl button,.mini{font-size:12px;border:1px solid var(--ui-border);background:var(--ui-field);border-radius:5px;min-width:26px;height:28px;cursor:pointer;color:var(--ui-text2);padding:0 6px}
.ctl button:hover,.mini:hover{background:var(--ui-sunk)}
.ctl button:disabled{opacity:.35;cursor:default}
.add,.btn{font-size:12.5px;border:1px dashed var(--ui-softline);background:var(--ui-soft);color:var(--ui-accent);border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:600}
.add:hover,.btn:hover{border-color:var(--ui-accent)}
.btn.solid{border:1px solid var(--ui-accent);background:var(--ui-accent);color:var(--ui-onaccent)}
.btn.solid:hover{background:var(--ui-accent-h)}
.btn:disabled{opacity:.45;cursor:default}
.photo-in{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:10px}
.photo-in img{width:64px;height:46px;object-fit:cover;border-radius:4px;border:1px solid var(--ui-border);background:#fff}
.photo-in .leeg{width:64px;height:46px;border-radius:4px;border:1px dashed var(--ui-border);background:var(--ui-sunk)}
.photo-in label{cursor:pointer;color:var(--ui-accent);font-weight:600}
.photo-in input{display:none}
.photo-in button{border:0;background:none;color:var(--ui-muted);cursor:pointer;font-size:12px;padding:0}
.panel{border:1px solid var(--ui-softline);background:var(--ui-soft);border-radius:12px;padding:12px;margin-bottom:14px}
.panel .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.vraag{font-size:13px;font-weight:600;margin:4px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.chip{font-size:12px;border:1px solid var(--ui-border);background:var(--ui-field);border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--ui-text2);text-align:left;line-height:1.3}
.chip:hover{border-color:var(--ui-accent);color:var(--ui-accent)}
.chip.on{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--ui-onaccent)}
.chip.ghost{border-style:dashed;color:var(--ui-muted)}
.seg{display:flex;border:1px solid var(--ui-border);border-radius:8px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;border:0;border-right:1px solid var(--ui-border);background:var(--ui-field);padding:7px 4px;font-size:12.5px;cursor:pointer;color:var(--ui-text2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ui-accent);color:var(--ui-onaccent);font-weight:600}
.seg.kort{max-width:220px}
.kaart{border:1px solid var(--ui-border);border-radius:10px;background:var(--ui-field);margin:0 0 10px}
.kaart.actief{border-color:var(--ui-accent);box-shadow:0 0 0 3px var(--ui-soft)}
.kaart.verborgen{opacity:.55}
.kaart-h{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;cursor:pointer}
.kaart-h .nr{font-weight:700;color:var(--ui-accent);font-variant-numeric:tabular-nums;flex:none}
.kaart-h .t{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kaart-h .t small{font-weight:400;color:var(--ui-muted)}
.kaart-b{padding:8px 10px 4px;border-top:1px dashed var(--ui-border)}
.tag{display:inline-block;font-size:10.5px;border-radius:4px;padding:0 5px;background:var(--ui-sunk);border:1px solid var(--ui-border);color:var(--ui-muted);margin-left:4px}
.check{display:flex;gap:8px;font-size:12.5px;padding:7px 9px;border-radius:8px;margin-bottom:6px;line-height:1.4}
.check.ok{background:var(--ok-bg);color:var(--ok)} .check.warn{background:var(--warn-bg);color:var(--warn)}
.check button{margin-left:auto;border:0;background:none;color:inherit;text-decoration:underline;cursor:pointer;font-size:12px}
.glasrij{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.zinrij{border:1px solid var(--ui-border);border-radius:8px;padding:8px;margin-bottom:8px;background:var(--ui-field)}
.zinrij.verborgen{opacity:.55}
.zinrij .boven{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.zinrij .boven input{flex:1}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,20,35,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-in{background:var(--ui-panel);color:var(--ui-text);border-radius:12px;padding:18px;width:min(540px,100%);max-height:100%;overflow:auto;box-shadow:var(--shadow)}
.modal .acts{display:flex;gap:8px;justify-content:flex-end}
hr.sc{border:0;border-top:1px solid var(--ui-border);margin:16px 0}

/* ---------- rapportbladen: A4 staand, altijd wit papier ---------- */
.page{width:210mm;height:297mm;background:#fff;position:relative;overflow:hidden;margin:0 0 8mm;box-shadow:var(--shadow);
  -webkit-print-color-adjust:exact;print-color-adjust:exact;font-family:var(--font);font-size:8.8pt;line-height:1.5;color:#222;color-scheme:light}
.page .deco{position:absolute;inset:0;pointer-events:none}
.page .frame{position:absolute;inset:6mm;border:.25mm solid #2b2b2b;pointer-events:none}
.page .body{position:absolute;top:17mm;left:18mm;right:18mm;bottom:22mm}
.page .col{height:100%;overflow:hidden;position:relative}
.page .foot{position:absolute;left:18mm;right:18mm;bottom:11mm;display:flex;justify-content:space-between;align-items:center;font-size:7.4pt;color:#8a8f98;letter-spacing:.02em;border-top:.2mm solid #e3e6ea;padding-top:2mm}
.page .foot b{color:var(--blue);font-weight:600}
.page [data-ga]{cursor:pointer;border-radius:1mm}
.page [data-ga]:hover{background:rgba(45,99,173,.06)}

.r-h1{display:inline-block;font-size:13pt;font-weight:700;letter-spacing:.13em;text-transform:uppercase;margin:0 0 4.2mm;padding-bottom:1.8mm;border-bottom:.9mm solid var(--blue);color:#111}
.r-h2{font-weight:700;font-size:10pt;margin:5mm 0 1.6mm;color:#111;display:flex;gap:2.5mm;align-items:baseline}
.r-h2 .nr{color:var(--blue);font-variant-numeric:tabular-nums}
.r-h1 + .r-h2{margin-top:0}
.r-h3{font-weight:700;font-size:7.6pt;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);margin:2.6mm 0 1mm}
.r-p{margin:0 0 2mm;white-space:pre-wrap}
.r-geen{margin:0 0 2mm;color:#444;display:flex;gap:2mm;align-items:center}
.r-geen::before{content:"";width:1.4mm;height:1.4mm;border-radius:50%;background:#9aa3ad;flex:none}
.r-li{display:flex;gap:2.4mm;margin:0 0 1mm}
.r-li:before{content:"";flex:none;width:1.4mm;height:1.4mm;border-radius:50%;background:var(--blue);margin-top:1.75mm}
.r-ol{margin:0 0 2mm;padding-left:5mm}
.r-ol li{margin:0 0 1mm;padding-left:1mm}
.r-ol li::marker{color:var(--blue);font-weight:700;font-variant-numeric:tabular-nums}
.r-info{display:grid;grid-template-columns:38mm 1fr 38mm 1fr;border-top:.2mm solid #d8dce2;margin:1mm 0 2mm}
.r-info>div{padding:1.6mm 2mm 1.6mm 0;border-bottom:.2mm solid #d8dce2}
.r-info>div:nth-child(odd){font-weight:600;color:#111}
.r-info.een{grid-template-columns:38mm 1fr}
.r-cx{display:grid;border-top:.2mm solid #d8dce2;margin:1mm 0 3mm;align-items:center}
.r-cx>div{padding:1.4mm 2mm 1.4mm 0;border-bottom:.2mm solid #d8dce2;min-height:5mm}
.r-cx>.h{font-size:7.2pt;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--blue);border-bottom:.35mm solid var(--blue)}
.r-cx .duim{width:22mm;height:14mm;padding:0;margin:1mm 0}
.r-kader{border:.35mm solid var(--blue);border-left-width:1.2mm;border-radius:1.2mm;padding:2.6mm 3.8mm 1.2mm;margin:1mm 0 3mm;background:#f4f8fd}
.r-kader .t{font-weight:700;color:var(--navy);margin:0 0 1.2mm}
.r-twee{display:grid;grid-template-columns:1fr 1fr;gap:5mm;margin:1mm 0 3mm}
.r-twee figure{margin:0}
.r-twee .im{height:58mm}
.fig-cap{font-size:7.4pt;color:#555;margin-top:1.2mm}
.r-toc{display:grid;grid-template-columns:12mm 1fr auto;border-top:.2mm solid #d8dce2;margin:0 0 4mm}
.r-toc>div{padding:1.7mm 0;border-bottom:.2mm solid #d8dce2}
.r-toc .n{color:var(--blue);font-weight:700;font-variant-numeric:tabular-nums}
.r-toc .p{text-align:right;font-variant-numeric:tabular-nums;color:#555}
.r-toc .hoofd{font-weight:700;color:#111}
.r-bijl{display:flex;flex-wrap:wrap;gap:2mm 5mm;margin:1mm 0 3mm}
.r-bijl span{display:flex;gap:1.6mm;align-items:center}
.r-bijl span::before{content:"✓";display:inline-flex;align-items:center;justify-content:center;width:3.2mm;height:3.2mm;border-radius:.6mm;background:var(--blue);color:#fff;font-size:6.5pt;font-weight:700}
.im{background:#eef1f5;border:.2mm solid #d8dce2;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;color:#9aa3ad;font-size:7.6pt}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.r-var{background:#fff1b8;color:#7a5200;border-radius:.6mm;padding:0 .6mm}
.st{display:inline-flex;align-items:center;gap:1.6mm;font-weight:600;color:#1d2a38}
.st::before{content:"";width:2.2mm;height:2.2mm;border-radius:50%;background:var(--c,#9aa3ad);flex:none}
.st.ja{--c:#2f8a4e}.st.standaard{--c:#2d63ad}.st.aanname{--c:#d08a1a}.st.nee{--c:#8a95a3}
.st.geen{--c:#2f8a4e}.st.klein{--c:#d08a1a}.st.groot{--c:#c4372b}
/* constatering (variant A): tekst met twee foto's, balk met uitgangspunt en gevolg */
.cA{margin:0 0 5mm}
.cA .kop{font-weight:700;color:#111;margin:0 0 1.4mm;display:flex;gap:2.4mm}
.cA .kop .nr{color:var(--blue);font-variant-numeric:tabular-nums}
.cA .rij{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4mm}
.cA .rij .im{height:40mm}
.cA .rij .x{white-space:pre-wrap}
.cA .lbl{font-size:7pt;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);margin-bottom:.8mm}
.cA .balk{display:grid;grid-template-columns:1fr 1fr;margin-top:2.4mm;border-top:.35mm solid var(--blue);background:#f4f8fd}
.cA .balk>div{padding:1.8mm 3mm}
.cA .balk>div+div{border-left:.2mm solid #d8dce2}
.note{margin-top:2.4mm;border:.35mm solid #c4372b;border-left-width:1.2mm;border-radius:1.2mm;background:#fdf3f2;padding:2mm 3.4mm;white-space:pre-wrap}
.note b{color:#9d2a20}

/* voorblad: donkerblauw vlak met de foto er half overheen */
.cover::before{content:"";position:absolute;left:0;right:0;top:0;height:150mm;background:var(--navy)}
.cover .cv-kicker{position:absolute;left:18mm;right:18mm;top:30mm;font-size:9pt;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#9cc1f2}
.cover .cv-title{position:absolute;left:18mm;right:18mm;top:39mm;margin:0;font-size:40pt;font-weight:800;letter-spacing:-.025em;line-height:1.05;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover .cv-title.lang{font-size:28pt;top:41mm}
.cover .cv-title.zeerlang{font-size:21pt;top:40mm;white-space:normal;max-height:48mm}
.cover .cv-sub{position:absolute;left:18mm;right:18mm;top:62mm;font-size:17pt;font-weight:500;color:#c9dcf5}
.cover .cv-title.zeerlang + .cv-sub{top:66mm}
.cover .cv-photo{position:absolute;left:18mm;right:18mm;top:92mm;height:118mm;border:2mm solid #fff;box-shadow:0 2mm 8mm rgba(10,30,60,.25);overflow:hidden;background:#e6ebf1;display:flex;align-items:center;justify-content:center;color:#8794a3;font-size:10pt}
.cover .cv-photo img{width:100%;height:100%;object-fit:cover;display:block}
.cover .cv-meta{position:absolute;left:18mm;right:74mm;bottom:20mm;margin:0;display:grid;grid-template-columns:repeat(3,auto);gap:5mm 8mm;font-size:8.8pt}
.cover .cv-meta dt{font-size:6.8pt;text-transform:uppercase;letter-spacing:.11em;color:#7b8794;margin-bottom:.8mm}
.cover .cv-meta dd{margin:0;font-weight:700}
.cover .cv-logo{position:absolute;right:18mm;bottom:18mm;height:25mm;display:block}
.overflow{outline:1.2mm dashed #e74c3c;outline-offset:-1mm}

@media (max-width:900px){
  .app{flex-direction:column;height:auto}
  .editor{width:100%;min-width:0;border-right:0;border-bottom:1px solid var(--ui-border)}
  .preview{padding:16px}
  .topbar{overflow-x:auto}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@page{size:A4 portrait;margin:0}
@media print{
  html,body{height:auto;background:#fff}
  .topbar,.editor,.modal{display:none!important}
  .app{display:block;height:auto}
  .preview{padding:0;overflow:visible}
  #pages{zoom:1!important;width:auto;margin:0}
  .page{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
  .page [data-ga]:hover{background:none}
  .r-var{background:none;color:inherit}
  .overflow{outline:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">RAPPORTBOUWER HOEVEELHEDEN<small>Calvisie</small></div>
  <div class="status" id="status"></div>
  <span class="proef" id="proef" hidden title="Opslaan en PDF maken zijn in deze weergave niet beschikbaar">Alleen bekijken</span>
  <button id="btnUndo" title="Laatste wijziging ongedaan maken (Ctrl+Z)" disabled>Ongedaan maken</button>
  <button id="btnNew" title="Nieuw rapport">Nieuw</button>
  <button id="btnOpen" title="Open een rapportbestand (.json) uit de projectmap">Openen</button>
  <button id="btnSave" title="Bewaar het rapportbestand in de projectmap (Ctrl+S)">Opslaan</button>
  <button id="btnPrint" class="primary" title="Bladen als PDF bewaren (A4 staand)">PDF maken</button>
</header>
<div class="app">
  <aside class="editor"><nav class="tabs" id="tabs"></nav><div id="form"></div></aside>
  <main class="preview" id="preview"><div id="pages"></div></main>
</div>
<input type="file" id="fileOpen" accept=".json,application/json" hidden>

<script src="lijsten.js"></script>
<script>
"use strict";
const IN_FRAME = (()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
const STORE_KEY = 'calvisie-hoeveelheden-v1';
const LIST_KEY = 'calvisie-hoeveelheden-lijsten-v1';
const VERSIE = 1;
const LOGO = 'assets/logo-calvisie.png';
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } },
};
const newId = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opsom = a => a.length<=1 ? a.join('') : a.slice(0,-1).join(', ')+' en '+a[a.length-1];

const leegGlas = () => ({id:newId(), soort:'', fabrikant:'', jaartal:'', ruimte:'', grillig:'', foto:'', verborgen:false});
function nieuwRapport(){
  const ond = {}; DEFAULT_LIJSTEN.ONDERDELEN.forEach(o=>ond[o.id]={eerst:'', afwijkend:'', items:[], glas:[]});
  return { versie:VERSIE,
    project:{complex:'', plaats:'', referentie:'', opdrachtgever:'', vgo:'', inspecteur:'', schouw:'', opgesteld:new Date().toISOString().slice(0,10),

function voorbeeldRapport(){
  const r = nieuwRapport();
  Object.assign(r.project, {complex:'De Voorbeeldhof', plaats:'Testdorp', referentie:'99001', opdrachtgever:'Woonstichting Voorbeeld', vgo:'Schildersbedrijf Proef',

  r.opmerkingen='Twee woningen waren tijdens de schouw niet toegankelijk. Voor deze woningen hebben wij het basispatroon aangehouden.';

/* oudere rapportbestanden aanvullen met wat later is toegevoegd, zodat er geen werk verloren gaat */
function migreer(r){
  const basis = nieuwRapport();
  const vul = (doel, bron) => { for(const k in bron){ if(doel[k]===undefined) doel[k]=clone(bron[k]); else if(bron[k] && typeof bron[k]==='object' && !Array.isArray(bron[k]) && typeof doel[k]==='object') vul(doel[k], bron[k]); } };
  vul(r, basis);
  for(const id in r.onderdelen) r.onderdelen[id].items.forEach(it=>vul(it, leegItem()));
  r.versie = VERSIE; return r;
}
let S = (()=>{ try{ const t=store.get(STORE_KEY); const r=t&&JSON.parse(t); return r&&r.onderdelen?migreer(r):null; }catch(e){ return null; } })() || voorbeeldRapport();

function onthoud(){ const j=JSON.stringify(S); if(HIST[HIST.length-1]!==j){ HIST.push(j); if(HIST.length>30) HIST.shift(); } document.getElementById('btnUndo').disabled=false; }
function ongedaan(){
  const nu=JSON.stringify(S); let j;
  do{ j=HIST.pop(); }while(j!==undefined && j===nu);
  document.getElementById('btnUndo').disabled=!HIST.length;
  if(j===undefined){ setStatus('Er is niets om ongedaan te maken'); return; }
  S=JSON.parse(j); changed(true); setStatus('Ongedaan gemaakt');
}
function getP(path){ return path.split('.').reduce((o,k)=>o==null?o:o[k], S); }
function setP(path, val){ const ks=path.split('.'); const last=ks.pop(); ks.reduce((o,k)=>(o[k]==null?(o[k]={}):o[k]), S)[last]=val; }

function openPunten(){
  const p=S.project, uit=[];
  [['complex','Projectnaam'],['plaats','Plaats'],['referentie','Referentie'],['opdrachtgever','Opdrachtgever'],['inspecteur','Inspecteur'],['schouw','Datum schouw']]
    .forEach(([k,l])=>{ if(!p[k]) uit.push({tab:'project', t:l+' is nog leeg'}); });
  for(const o of OND()){
    const d=S.onderdelen[o.id];
    if(o.eerst && !d.eerst){ uit.push({tab:'o:'+o.id, t:`${o.nr} ${o.kort||o.titel}: ${o.eerst}`}); continue; }
    if(o.eerst && d.eerst==='nee') continue;
    if(!d.afwijkend) uit.push({tab:'o:'+o.id, t:`${o.nr} ${o.kort||o.titel}: ${o.afwijkend}`});
    if(d.afwijkend==='ja'){
      const zicht=d.items.filter(i=>!i.verborgen);
      if(!zicht.length) uit.push({tab:'o:'+o.id, t:`${o.nr} ${o.kort||o.titel}: nog geen constatering`});
      zicht.forEach((it,i)=>{ if(!it.tekst||!it.op||!it.gv) uit.push({tab:'o:'+o.id, t:`${o.nr}.${i+1}: constatering, hoeveelheden of gevolg is nog leeg`});
        else if(it.glasId && !it.standaard) uit.push({tab:'o:'+o.id, t:`${o.nr}.${i+1}: nog niet ingevuld waar wij standaard van zijn uitgegaan`}); });
    }
  }
  return uit;
}

/* pop-up bij grillige beglazing: wat is geconstateerd en waar zijn we standaard van uitgegaan */
function grilligPopup(od, g){
  document.querySelector('.modal')?.remove();
  const bestaand = od.items.find(x=>x.glasId===g.id);
  const naam = [g.soort, g.ruimte].filter(Boolean).join(', ') || 'beglazing';
  const m = toEl(`<div class="modal"><div class="modal-in" role="dialog" aria-modal="true" aria-labelledby="gp-t">
    <div class="sec-title" id="gp-t">Grillige beglazing: ${esc(naam)}</div>
    <p class="hint">Dit komt als constatering in het rapport, onder de tabel met beglazing.</p>
    <label class="f"><span>Wat hebben we geconstateerd?</span><textarea id="gp-c" rows="3" placeholder="Bijv. De beglazing is op enkele plekken vervangen door nieuwere beglazing.">${esc(bestaand?bestaand.tekst:'')}</textarea></label>
    <label class="f"><span>Waar zijn we standaard van uitgegaan?</span><textarea id="gp-s" rows="3" placeholder="Bijv. Wij zijn voor alle woningen uitgegaan van de oorspronkelijke HR++-beglazing.">${esc(bestaand?bestaand.standaard:'')}</textarea></label>
    <div class="acts"><button type="button" class="btn" id="gp-nee">Annuleren</button><button type="button" class="btn solid" id="gp-ja">Opslaan</button></div></div></div>`);
  document.body.appendChild(m);
  const sluit = () => { m.remove(); document.removeEventListener('keydown', esc_); };
  const annuleer = () => { sluit(); if(!bestaand){ g.grillig=''; changed(true); setStatus('Grillig niet gewijzigd'); } };
  const esc_ = e => { if(e.key==='Escape') annuleer(); };
  document.addEventListener('keydown', esc_);
  m.querySelector('#gp-nee').onclick = annuleer;
  m.querySelector('#gp-ja').onclick = () => {
    const tekst=m.querySelector('#gp-c').value.trim(), standaard=m.querySelector('#gp-s').value.trim();
    if(!tekst || !standaard){ const leeg=m.querySelector(tekst?'#gp-s':'#gp-c'); leeg.focus(); leeg.style.borderColor='var(--bad)'; return; }
    let it=bestaand;
    if(bestaand) onthoud(); else { it=leegItem({glasId:g.id, titel:'Grillige beglazing: '+(g.soort||naam)}); od.items.push(it); }
    Object.assign(it, {tekst, standaard, verborgen:false}); od.afwijkend='ja'; UI.open=it.id;
    sluit(); changed(true); setStatus('Constatering bewaard: kies nog hoeveelheden en gevolgen');
    setTimeout(()=>document.getElementById('c-'+it.id)?.scrollIntoView({block:'nearest'}),0);
  };
  m.querySelectorAll('textarea').forEach(t=>t.oninput=()=>t.style.borderColor='');
  m.querySelector('#gp-c').focus();
}

function readImage(file, max, type){
  return new Promise((res,rej)=>{
    const fr=new FileReader(); fr.onerror=rej;
    fr.onload=()=>{ const img=new Image(); img.onerror=rej; img.onload=()=>{
      const s=Math.min(1, max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      const g=c.getContext('2d'); if(type==='image/jpeg'){ g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); }
      g.drawImage(img,0,0,c.width,c.height); res(c.toDataURL(type,.85)); }; img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

  ];
  let n=4;
  if(S.opmerkingen.trim()){ b3.push({html:`<div class="r-h2" data-ga="afronding"><span class="nr">3.${n}</span>Opmerkingen</div>`, keep:true, toc:['3.'+n,'Opmerkingen']}, {html:`<p class="r-p" data-ga="afronding">${esc(S.opmerkingen.trim())}</p>`}); n++; }
  if(S.bijlagen.length){ b3.push({html:`<div class="r-h2" data-ga="afronding"><span class="nr">3.${n}</span>Bijlagen</div>`, keep:true, toc:['3.'+n,'Bijlagen']}, {html:`<div class="r-bijl" data-ga="afronding">${S.bijlagen.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`}); }
  S2.push({toc:['3.0','Hoeveelheden'], blocks:b3});
  return S2;
}

const DECO = `<svg class="deco" viewBox="0 0 210 297" preserveAspectRatio="none" aria-hidden="true"><g stroke="#efefef" stroke-width=".45" fill="none">
  <line x1="44" y1="6" x2="6" y2="88"/><line x1="86" y1="6" x2="6" y2="180"/><line x1="6" y1="120" x2="86" y2="291"/><line x1="6" y1="230" x2="34" y2="291"/></g></svg>`;
const toEl = h => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstElementChild; };
function coverPage(){
  const p=S.project, naam=p.complex||'Projectnaam';
  const kl = naam.length>34 ? 'zeerlang' : naam.length>20 ? 'lang' : '';
  return toEl(`<section class="page cover" data-ga="project">
    <div class="cv-kicker">Rapportage hoeveelheden</div>
    <h1 class="cv-title ${kl}">${esc(naam)}</h1>
    <div class="cv-sub">${p.plaats?'te '+esc(p.plaats):''}</div>
    <div class="cv-photo">${p.coverfoto?`<img src="${p.coverfoto}" alt="">`:'Foto van het complex (kies bij Project)'}</div>
    <dl class="cv-meta">
      <div><dt>Opdrachtgever</dt><dd>${esc(p.opdrachtgever||'–')}</dd></div><div><dt>Referentie</dt><dd>${esc(p.referentie||'–')}</dd></div><div><dt>Datum</dt><dd>${esc(fmtShort(p.opgesteld)||'–')}</dd></div>
      <div><dt>Aantal VHE</dt><dd>${esc(p.vhe?p.vhe+' VHE':'–')}</dd></div><div><dt>Schouw</dt><dd>${esc(fmtShort(p.schouw)||'–')}</dd></div><div><dt>Inspecteur</dt><dd>${esc(p.inspecteur||'–')}</dd></div></dl>
    <img class="cv-logo" src="${LOGO}" alt="Calvisie">
  </section>`);
}
function renderReport(){
  const root=document.getElementById('pages'); root.innerHTML='';
  root.appendChild(coverPage());
  let col=null; const tocItems=[];
  const newPage = () => { const pg=toEl(`<section class="page">${DECO}<div class="frame"></div><div class="body"><div class="col"></div></div><div class="foot"><span></span><span></span></div></section>`); root.appendChild(pg); col=pg.querySelector('.col'); };
  const fits = () => col.scrollHeight <= col.clientHeight + 1;
  const place = b => { const el=toEl(b.html); col.appendChild(el); if(!fits()){ el.remove(); return null; } return el; };
  for(const sec of stukken()){
    newPage();
    if(sec.toc) tocItems.push({nr:sec.toc[0], t:sec.toc[1], hoofd:true, page:root.children.length});
    let chain=[];
    for(const b of sec.blocks){
      let el=place(b);
      if(!el){
        const moving = chain.length && chain.length < col.childElementCount ? chain : [];
        moving.forEach(x=>x.remove()); newPage(); moving.forEach(x=>col.appendChild(x));
        el=place(b);
        if(!el){ el=toEl(b.html); el.classList.add('overflow'); col.appendChild(el); }
      }
      if(b.toc) tocItems.push({nr:b.toc[0], t:b.toc[1], el});
      chain = b.keep ? [...chain, el] : [];
    }
  }
  const pages=[...root.querySelectorAll('.page')];
  const toc=document.getElementById('toc');
  if(toc) toc.innerHTML = tocItems.map(i=>{ const n = i.el ? pages.indexOf(i.el.closest('.page'))+1 : i.page;
    return `<div class="n">${i.nr}</div><div class="${i.hoofd?'hoofd':''}">${esc(i.t)}</div><div class="p">${n}</div>`; }).join('');
  const p=S.project;
  const links = [`<b>Rapportage hoeveelheden</b>`, esc([p.complex, p.plaats&&('te '+p.plaats)].filter(Boolean).join(' ')), p.referentie?esc('ref. '+p.referentie):''].filter(Boolean).join(' · ');
  pages.forEach((pg,i)=>{ const f=pg.querySelector('.foot'); if(f){ f.children[0].innerHTML=links; f.children[1].textContent=`Blad ${i+1} van ${pages.length}`; } });
  fitZoom();
}
function fitZoom(){
  const prev=document.getElementById('preview'), pages=document.getElementById('pages');
  const avail=prev.clientWidth-(window.innerWidth<900?32:48);
  pages.style.zoom=Math.min(1.25, Math.max(.3, avail/(210*96/25.4)));
}
window.addEventListener('resize', ()=>{ clearTimeout(window._rz); window._rz=setTimeout(fitZoom,100); });

/* =====================================================================
   Opslaan, openen, PDF
   ===================================================================== */
const bestandsnaam = ext => { const p=S.project; return [p.referentie, 'Hoeveelheden', [p.complex, p.plaats&&('te '+p.plaats)].filter(Boolean).join(' ')].filter(Boolean).join(' - ') + ext; };
function download(blob, name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
/* Online (in claude.ai) kan de pagina niet zelf afdrukken of downloaden: bewaren loopt daar via
   de downloads-functie van de viewer en de PDF wordt in de pagina zelf gemaakt. */
let DL=null;
const kanDirectPdf = () => typeof html2canvas!=='undefined' && typeof PDFLib!=='undefined';
const SOORT = {json:{description:'Rapportbestand', accept:{'application/json':['.json']}}, pdf:{description:'PDF', accept:{'application/pdf':['.pdf']}}};
async function bewaar(naam, data, soort){
  if(DL){
    try{ await DL.save({filename:naam, data}); return true; }
    catch(e){ if(e && e.code==='declined') return false;
      throw new Error(e && e.code==='rate_limited' ? 'Er staat nog een bewaarvenster open. Probeer het zo opnieuw.' : 'Bewaren lukt in deze weergave niet.'); }
  }
  if(window.showSaveFilePicker && !IN_FRAME){
    try{ const h=await showSaveFilePicker({suggestedName:naam, types:[SOORT[soort]]}); const w=await h.createWritable(); await w.write(data); await w.close(); return true; }
    catch(e){ if(e.name==='AbortError') return false; }
  }
  download(new Blob([data]), naam); return true;
}
async function saveJson(){
  const data=JSON.stringify(S,null,1), naam=bestandsnaam(' - rapport.json');
  if(!DL && window.showSaveFilePicker && !IN_FRAME){
    try{ if(!fileHandle) fileHandle=await showSaveFilePicker({suggestedName:naam, types:[SOORT.json]});
      const w=await fileHandle.createWritable(); await w.write(data); await w.close(); setStatus(`Opgeslagen: ${fileHandle.name}`); return; }
    catch(e){ if(e.name==='AbortError') return; fileHandle=null; }
  }
  try{ if(await bewaar(naam, data, 'json')) setStatus('Rapportbestand bewaard'); }
  catch(e){ setStatus(e.message); }
}
function openJson(text, naam, handle){
  try{ const r=JSON.parse(text); if(!r || !r.onderdelen) throw new Error('soort'); onthoud(); S=migreer(r); fileHandle=handle||null; UI.open=null; UI.tab='project'; changed(true); setStatus('Geopend: '+naam); }
  catch(e){ setStatus('Dit bestand is geen rapportbestand van de rapportbouwer hoeveelheden.'); }
}
async function pdfBytes(voortgang){
  const host=document.createElement('div');
  host.style.cssText='position:fixed;left:-10000px;top:0;width:210mm;background:#fff';
  document.body.appendChild(host);
  try{
    const pdf=await PDFLib.PDFDocument.create();
    const bladen=[...document.querySelectorAll('#pages .page')];
    for(const [i,pg] of bladen.entries()){
      voortgang && voortgang(i+1, bladen.length);
      const c=pg.cloneNode(true); c.style.margin='0'; c.style.boxShadow='none';
      c.querySelectorAll('.r-var').forEach(x=>x.classList.remove('r-var'));
      host.replaceChildren(c);
      const canvas=await html2canvas(c,{scale:2.5, backgroundColor:'#ffffff', logging:false});
      const jpg=await pdf.embedJpg(canvas.toDataURL('image/jpeg',.92));
      pdf.addPage([595.28,841.89]).drawImage(jpg,{x:0,y:0,width:595.28,height:841.89});
    }
    pdf.setTitle(bestandsnaam('')); pdf.setCreator('Rapportbouwer hoeveelheden');
    return await pdf.save();
  } finally { host.remove(); }
}
let pdfBezig=false;
async function maakPdf(){
  if(!IN_FRAME){ const old=document.title; document.title=bestandsnaam(''); window.print(); setTimeout(()=>document.title=old,500); return; }
  if(pdfBezig || !kanDirectPdf() || !DL) return;
  pdfBezig=true;
  try{
    const naam=bestandsnaam('.pdf');
    const bytes=await pdfBytes((i,n)=>setStatus(`PDF maken: blad ${i} van ${n} …`));
    setStatus(await bewaar(naam, bytes, 'pdf') ? 'PDF bewaard' : 'PDF niet bewaard');
  }catch(e){ setStatus('PDF maken lukt in deze weergave niet. Gebruik de versie op je pc.'); }
  pdfBezig=false;
}

document.getElementById('btnUndo').onclick = ongedaan;
document.getElementById('btnNew').onclick = ()=>{ UI.nieuw=true; renderForm(false); form.scrollTop=0; };
document.getElementById('btnSave').onclick = saveJson;
document.getElementById('btnOpen').onclick = async ()=>{
  if(window.showOpenFilePicker && !IN_FRAME){
    try{ const [h]=await showOpenFilePicker({types:[SOORT.json]}); const f=await h.getFile(); openJson(await f.text(), f.name, h); return; }
    catch(e){ if(e.name==='AbortError') return; }
  }
  document.getElementById('fileOpen').click();
};
document.getElementById('fileOpen').onchange = async e=>{ const f=e.target.files[0]; if(f) openJson(await f.text(), f.name); e.target.value=''; };
document.getElementById('btnPrint').onclick = maakPdf;
window.addEventListener('keydown', e=>{ if((e.ctrlKey||e.metaKey) && !e.shiftKey && e.key.toLowerCase()==='z' && !e.target.closest('input,textarea')){ e.preventDefault(); ongedaan(); } });
window.addEventListener('keydown', e=>{ if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s' && (!IN_FRAME||DL)){ e.preventDefault(); saveJson(); } });
function knoppen(){
  document.getElementById('btnSave').hidden = IN_FRAME && !DL;
  document.getElementById('btnPrint').hidden = IN_FRAME && !(DL && kanDirectPdf());
  document.getElementById('proef').hidden = !(IN_FRAME && !DL);
}
knoppen();
if(window.claude && typeof window.claude.use==='function')
  window.claude.use('downloads').then(d=>{ DL=d||null; knoppen(); if(UI.tab==='export') renderForm(); }).catch(()=>{});

renderForm(false);
(document.fonts?.ready || Promise.resolve()).then(renderReport);
renderReport();
</script>
